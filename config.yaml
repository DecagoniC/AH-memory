# AH Memory — локальный конфиг
# Ключ: DEEPSEEK_API_KEY в .env (или config.local.yaml)

deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  timeout_sec: 60
  temperature: 0.1

web:
  host: "127.0.0.1"
  port: 8000

agent:
  use_llm: true
  fallback_rules: true
  ticks: 6
  preload: "empty"  # empty | rabbit | encyclopedia — для своих запросов: empty
