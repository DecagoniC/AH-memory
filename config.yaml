# AH Memory — локальный конфиг
# Ключи: .env (GIGACHAT_* / DEEPSEEK_API_KEY) или поля ниже

llm_provider: gigachat  # gigachat | deepseek

gigachat:
  credentials: "PASTE_GIGACHAT_CREDENTIALS_HERE"
  scope: "GIGACHAT_API_B2B"
  base_url: "https://gigachat.devices.sberbank.ru/api/v1"
  auth_url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
  model: "GigaChat-2-Pro"
  timeout_sec: 60
  temperature: 0.1
  verify_ssl: false

deepseek:
  api_key: "PASTE_DEEPSEEK_API_KEY_HERE"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  timeout_sec: 60
  temperature: 0.1

ollama:
  base_url: "http://127.0.0.1:11434"
  model: "llama3.2"
  embedding_model: "nomic-embed-text"
  timeout_sec: 60
  temperature: 0.1

web:
  host: "127.0.0.1"
  port: 8000

agent:
  use_llm: true
  fallback_rules: true
  ticks: 6
  preload: "empty"
  llm_provider: gigachat

open_semantics:
  enabled: true
  normalization_mode: normalized  # fixed | normalized | learned
  embedding_similarity_threshold: 0.55
  parameter_seed: 42
  trace_messages: false

# Pluggable embedding backend for entity resolution (and future semantic match).
# GigaChat models use GIGACHAT_CREDENTIALS (same key as chat).
embedding:
  model: EmbeddingsGigaR  # EmbeddingsGigaR | Embeddings-2 | Embeddings | deterministic_ngram
  dimensions: 64  # ignored for GigaChat (taken from API response)

# Resolve mentions to existing symbols before creating duplicates.
identity:
  enabled: true
  use_embeddings: true
  safety_threshold: 0.94
  margin: 0.05


experiment:
  random_seed: 42
  history_retention: 100
  activation:
    type: linear  # linear | sigmoid | relu
    alpha: 1.0
    beta: 1.0
    gamma: 1.0
    decay: 0.1
    eta: 0.5
  factors:
    is_a_up: 0.9
    is_a_down: 0.2
    follow_forward: 0.8
    follow_backward: 0.1
    association: 0.4
    bind: 0.8
    hypernode_strength: 0.6
    hypernode_mode: soft_and  # and | soft_and | pairwise
  inference:
    max_ticks: 20
    threshold: 0.7
    convergence_epsilon: 0.001
    damping: 0.4
    evidence_decay: 0.5
    factor_evaluation: auto  # exact | approximate | auto
    exact_max_arity: 12
    contribution_mode: delta  # delta | counterfactual_logit
  competition:
    enabled: false
    type: none  # none | local | global | top_k
    strength: 0.0
    top_k: 10
