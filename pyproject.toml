[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ah-memory"
version = "0.4.0"
description = "Associative-heterarchical memory prototype for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.4",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
experiment = ["matplotlib>=3.8"]

[project.scripts]
ah-web = "web.app:main"
ah-entity-resolution = "ah_memory.benchmarks.entity_resolution.runner:main"
ah-challenge = "ah_memory.benchmarks.challenge.runner:main"

[tool.setuptools]
packages = [
  "ah_memory",
  "ah_memory.baselines",
  "ah_memory.benchmarks",
  "ah_memory.benchmarks.challenge",
  "ah_memory.benchmarks.entity_resolution",
  "ah_memory.eval",
  "ah_memory.examples",
  "ah_memory.synthetic",
  "benchmark",
  "benchmark.entity_resolution",
  "web",
]

[tool.setuptools.package-dir]
"ah_memory" = "src/ah_memory"
"web" = "web"

[tool.setuptools.package-data]
web = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "integration: live model tests; skipped unless --run-integration",
]
